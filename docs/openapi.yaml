        - name: mediumId
          in: path
          required: true
          schema:
            type: string
          description: 媒体资源ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediumListResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限删除媒体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 评论或媒体不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token认证，格式为：Bearer <token>
        
        获取方式：
        1. 用户名密码登录：POST /auth/login
        2. 邮箱验证码登录：POST /auth/login-with-code
        3. 微信小程序登录：POST /auth/login-with-wechat
        
        Token会在登录成功后通过响应头Authorization和响应体data.token同时返回。

  schemas:
    # ==================== 请求模型 ====================
    RegisterRequest:
      type: object
      required:
        - user
        - verification
      properties:
        user:
          $ref: '#/components/schemas/CreateUserRequest'
        verification:
          $ref: '#/components/schemas/VerificationParam'
      example:
        user:
          username: "johndoe"
          password: "password123"
          email: "john@example.com"
          nickname: "John Doe"
          bio: "Hello, I'm John!"
        verification:
          principle: "john@example.com"
          token: "reg_abc123"
          scope: "register"
          credential: "123456"

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 用户名，2-50个字符，支持字母、数字、下划线
          example: "johndoe"
        password:
          type: string
          minLength: 8
          maxLength: 20
          description: 密码，8-20个字符
          example: "password123"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "john@example.com"
        nickname:
          type: string
          maxLength: 100
          description: 昵称，最大100个字符
          example: "John Doe"
        bio:
          type: string
          maxLength: 1023
          description: 个人简介，最大1023个字符
          example: "Hello, I'm John!"

    WeChatRegisterRequest:
      type: object
      required:
        - code
        - username
        - password
      properties:
        code:
          type: string
          description: 微信小程序授权码，通过wx.login()获取
          example: "061234567890abcdef"
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 用户名
          example: "wechat_user"
        password:
          type: string
          minLength: 8
          maxLength: 20
          description: 登录密码
          example: "password123"
        nickname:
          type: string
          maxLength: 100
          description: 昵称
          example: "微信用户"
        bio:
          type: string
          maxLength: 1023
          description: 个人简介
          example: "通过微信注册的用户"

    PasswordUpdateRequest:
      type: object
      required:
        - email
        - password
        - verification
      properties:
        email:
          type: string
          format: email
          description: 用户邮箱
          example: "john@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 20
          description: 新密码
          example: "newpassword123"
        verification:
          $ref: '#/components/schemas/VerificationParam'

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 100
          description: 昵称
          example: "New Nickname"
        bio:
          type: string
          maxLength: 1023
          description: 个人简介
          example: "更新后的个人简介"
        profileSlug:
          type: string
          maxLength: 100
          description: 个人页面地址
          example: "my-profile"

    UploadRequest:
      type: object
      required:
        - type
        - size
      properties:
        type:
          type: string
          description: 文件MIME类型
          enum:
            - image/jpeg
            - image/png
            - image/gif
          example: "image/jpeg"
        size:
          type: integer
          minimum: 1
          maximum: 5242880
          description: 文件大小（字节），最大5MB
          example: 1024000

    VerificationParam:
      type: object
      required:
        - principle
        - token
        - scope
        - credential
      properties:
        principle:
          type: string
          description: 验证主体（通常是邮箱地址）
          example: "john@example.com"
        token:
          type: string
          description: 验证令牌（从发送验证码接口获取）
          example: "reg_abc123"
        scope:
          type: string
          description: 验证范围
          enum:
            - register
            - login
            - reset_password
          example: "register"
        credential:
          type: string
          description: 验证码（6位数字）
          example: "123456"

    UsernamePasswordLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名
          example: "johndoe"
        password:
          type: string
          description: 密码
          example: "password123"

    EmailCodeLoginRequest:
      type: object
      required:
        - principle
        - token
        - scope
        - credential
      properties:
        principle:
          type: string
          description: 邮箱地址
          example: "john@example.com"
        token:
          type: string
          description: 验证令牌（从发送登录验证码接口获取）
          example: "login_abc123"
        scope:
          type: string
          description: 验证范围，登录时固定为"login"
          enum:
            - login
          example: "login"
        credential:
          type: string
          description: 邮箱验证码（6位数字）
          example: "123456"

    WeChatLoginRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: 微信小程序授权码，通过wx.login()获取
          example: "061234567890abcdef"

    # ==================== 响应模型 ====================
    AuthTokenResponse:
      type: object
      properties:
        code:
          type: integer
          description: 响应状态码
          example: 10000
        message:
          type: string
          description: 响应消息
          example: "Success"
        data:
          type: object
          properties:
            token:
              type: string
              description: 验证令牌，用于后续验证
              example: "reg_abc123def456"

    RegisterResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Success"
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              description: 注册成功的邮箱地址
              example: "john@example.com"

    WeChatRegisterResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Success"
        data:
          type: object
          properties:
            openId:
              type: string
              description: 微信OpenID
              example: "ox1234567890abcdef"

    PasswordResetResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Success"
        data:
          type: object
          properties:
            success:
              type: boolean
              description: 密码重置是否成功
              example: true

    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            username:
              type: string
              description: 登录用户名
              example: "johndoe"
            token:
              type: string
              description: JWT Token（也会在响应头Authorization中返回）
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserDetails:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Success"
        data:
          type: object
          properties:
            id:
              type: integer
              description: 用户ID
              example: 123
            username:
              type: string
              description: 用户名
              example: "johndoe"
            nickname:
              type: string
              description: 昵称
              example: "John Doe"
            bio:
              type: string
              description: 个人简介
              example: "Hello, I'm John!"
            profileSlug:
              type: string
              description: 个人页面地址
              example: "my-profile"
            avatarUrl:
              type: string
              description: 头像URL
              example: "https://storage.example.com/avatar/123.jpg"
            role:
              type: string
              enum:
                - USER
                - ADMIN
                - MODERATOR
              description: 用户角色
              example: "USER"
            status:
              type: string
              enum:
                - Active
                - Inactive
                - Banned
              description: 用户状态
              example: "Active"
            verifiedId:
              type: integer
              description: 认证信息ID
              example: 456
            createdAt:
              type: string
              format: date-time
              description: 创建时间
              example: "2024-01-01T00:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 更新时间
              example: "2024-01-01T12:00:00Z"

    AvatarUploadResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10000
        message:
          type: string
          example: "Success"
        data:
          type: object
          properties:
            uploadUrl:
              type: string
              description: 预签名上传URL，用于上传头像文件
              example: "https://storage.example.com/upload/avatar/abc123.jpg?signature=xyz"
            accessUrl:
              type: string
              description: 头像访问URL，上传成功后可通过此URL访问头像
              example: "https://storage.example.com/avatar/testuser.jpg"

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: 错误代码
          example: 10001
        message:
          type: string
          description: 错误消息
          example: "Invalid parameters"
        data:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties:
                type: string
          description: 错误详细信息，验证失败时包含字段级错误
          example:
            username: "用户名长度必须在2-50个字符之间"
            password: "密码长度必须在8-20个字符之间"

    DraftContentEditorRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          description: 帖子标题
          example: "如何准备计算机网络考试"
        content:
          type: string
          description: 帖子正文内容（可为空表示继续保留原内容）
          example: "分享一些复习计算机网络的资料和经验..."
        category:
          type: string
          maxLength: 100
          description: 帖子分类
          example: "学习心得"

    PostAuthor:
      type: object
      description: 帖子作者信息
      properties:
        id:
          type: integer
          example: 1001
        username:
          type: string
          example: "johndoe"
        nickname:
          type: string
          example: "约翰"
        bio:
          type: string
          example: "喜欢分享编程经验"
        profileSlug:
          type: string
          example: "john-profile"
        avatarUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/avatar/john.jpg"
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - MODERATOR
          example: "USER"
        status:
          type: string
          enum:
            - Active
            - Inactive
            - Banned
          example: "Active"
        verifiedId:
          type: integer
          nullable: true
          example: 10
        createdAt:
          type: string
          format: date-time
          example: "2024-02-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-05-01T12:30:00Z"

    Medium:
      type: object
      description: 媒体资源信息
      properties:
        id:
          type: string
          example: "media_abc123"
        displayUrl:
          type: string
          format: uri
          description: 用于前端展示的访问地址
          example: "https://cdn.example.com/post/media_abc123.jpg"
        resourceUrl:
          type: string
          format: uri
          description: 资源真实访问地址
          example: "https://storage.example.com/media/media_abc123"
        type:
          type: string
          description: 媒体类型，如image/video/cover等
          example: "image"

    PostDetail:
      type: object
      description: 帖子详细信息
      properties:
        id:
