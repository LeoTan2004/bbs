openapi: 3.0.3
info:
  title: BBS论坛用户管理API
  description: |
    BBS论坛系统的用户认证与管理接口文档
    
    ## 功能概述
    本API提供用户注册、登录、个人信息管理等核心功能，支持多种认证方式。
    
    ## 认证机制
    - JWT Token认证：登录成功后返回JWT Token，需在请求头中携带 `Authorization: Bearer <token>`
    - 三种登录方式：
      1. 用户名密码登录：传统的用户名+密码认证
      2. 邮箱验证码登录：通过邮箱接收验证码进行认证
      3. 微信小程序登录：使用微信小程序授权码登录
    - 用户注册支持：邮箱验证码注册、微信小程序注册
    
    ## 错误处理
    所有接口均返回统一格式的响应，包含状态码、消息和数据。错误时会返回对应的错误码和错误信息。
  version: 0.1.0
  contact:
    name: BBS开发团队-后端组
    email: leotanstudio@gmail.com

servers:
  - url: http://bbs.leocoding.onliine
    description: 测试环境

paths:
  /auth/register/send-code:
    post:
      tags:
        - 用户认证
      summary: 发送注册验证码
      description: |
        向指定邮箱发送注册验证码，用于用户注册时的邮箱验证。
        
        **注意事项：**
        - 同一邮箱1分钟内只能发送一次验证码
        - 验证码有效期为10分钟
        - 邮箱格式必须正确
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            example: "user@example.com"
          description: 用户邮箱地址
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: 邮箱格式错误
                  value:
                    code: 10001
                    message: "Invalid parameters"
                    data: 
                      email: "邮箱格式不正确"
                email_exists:
                  summary: 邮箱已存在
                  value:
                    code: 20003
                    message: "User already exists"
                    data: null
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 10004
                message: "Too many requests"
                data: null

  /auth/register:
    post:
      tags:
        - 用户认证
      summary: 用户注册
      description: |
        通过邮箱验证码完成用户注册。需要先调用发送验证码接口获取验证码。
        
        **注册流程：**
        1. 调用 `/auth/register/send-code` 发送验证码
        2. 用户收到验证码后，调用此接口完成注册
        3. 注册成功后可直接登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: 注册失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: 参数验证失败
                  value:
                    code: 10001
                    message: "Invalid parameters"
                    data:
                      username: "用户名长度必须在2-50个字符之间"
                      password: "密码长度必须在8-20个字符之间"
                username_occupied:
                  summary: 用户名已被占用
                  value:
                    code: 20003
                    message: "User already exists"
                    data: null
                verification_expired:
                  summary: 验证码已过期
                  value:
                    code: 10001
                    message: "Invalid parameters"
                    data: null

  /auth/register/wechat:
    post:
      tags:
        - 用户认证
      summary: 微信小程序注册
      description: |
        通过微信小程序授权码完成用户注册。
        
        **使用说明：**
        - 需要微信小程序调用wx.login()获取code
        - 服务端会通过code获取用户的OpenID
        - 同一个OpenID只能注册一次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatRegisterRequest'
      responses:
        '200':
          description: 微信注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatRegisterResponse'

  /auth/login/send-code:
    post:
      tags:
        - 用户认证  
      summary: 发送登录验证码
      description: |
        向已注册的邮箱发送登录验证码。
        
        **注意事项：**
        - 邮箱必须已经注册
        - 验证码有效期为10分钟
        - 同一邮箱1分钟内只能发送一次
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            example: "user@example.com"
          description: 已注册的用户邮箱
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 邮箱不存在或格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password/send-code:
    post:
      tags:
        - 用户认证
      summary: 发送密码重置验证码
      description: |
        向已注册的邮箱发送密码重置验证码。
        
        **使用场景：**
        - 用户忘记密码时使用
        - 验证码有效期为10分钟
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            example: "user@example.com"
          description: 需要重置密码的用户邮箱
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 邮箱不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags:
        - 用户认证
      summary: 重置密码
      description: |
        通过邮箱验证码重置用户密码。
        
        **操作流程：**
        1. 先调用发送密码重置验证码接口
        2. 用户收到验证码后调用此接口
        3. 密码重置成功后需要重新登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          description: 重置失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - 用户认证
      summary: 用户名密码登录
      description: |
        使用用户名和密码进行登录认证。
        
        **登录流程：**
        1. 提供用户名和密码
        2. 登录成功返回JWT Token
        3. 后续请求需在Authorization头中携带Token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernamePasswordLoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Authorization:
              description: JWT Token，格式为 "Bearer <token>"
              schema:
                type: string
                example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 20002
                message: "Incorrect password"
                data: null

  /auth/login-with-code:
    post:
      tags:
        - 用户认证
      summary: 邮箱验证码登录
      description: |
        使用邮箱验证码进行登录认证。
        
        **登录流程：**
        1. 先调用 `/auth/login/send-code` 发送验证码
        2. 用户收到验证码后调用此接口
        3. 登录成功返回JWT Token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailCodeLoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Authorization:
              description: JWT Token，格式为 "Bearer <token>"
              schema:
                type: string
                example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: 验证码错误或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login-with-wechat:
    post:
      tags:
        - 用户认证
      summary: 微信小程序登录
      description: |
        使用微信小程序授权码进行登录认证。
        
        **登录流程：**
        1. 微信小程序调用wx.login()获取code
        2. 将code发送到此接口进行认证
        3. 登录成功返回JWT Token
        
        **注意事项：**
        - code只能使用一次
        - 用户必须已经通过微信注册
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeChatLoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Authorization:
              description: JWT Token，格式为 "Bearer <token>"
              schema:
                type: string
                example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: 微信授权码无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 用户未注册或认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user:
    get:
      tags:
        - 用户管理
      summary: 获取当前用户信息
      description: |
        获取当前登录用户的详细信息。
        
        **权限要求：** 需要登录
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取用户信息成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '401':
          description: 未登录或token已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/{username}:
    get:
      tags:
        - 用户管理
      summary: 根据用户名获取用户信息
      description: |
        获取指定用户名的用户公开信息。
        
        **权限要求：** 需要登录
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            example: "johndoe"
          description: 用户名
      responses:
        '200':
          description: 获取用户信息成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/{username}/avatar:
    post:
      tags:
        - 用户管理
      summary: 获取头像上传链接
      description: |
        获取用于上传用户头像的预签名URL和访问URL。
        
        **权限要求：** 只能为自己上传头像
        **文件限制：**
        - 支持的格式：image/jpeg, image/png, image/gif
        - 最大文件大小：5MB
        
        **返回信息：**
        - uploadUrl: 用于上传头像文件的预签名URL
        - accessUrl: 上传成功后访问头像的URL
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            example: "johndoe"
          description: 用户名（必须是当前登录用户）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: 获取上传链接成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                file_too_large:
                  summary: 文件过大
                  value:
                    code: 90004
                    message: "File upload failed"
                    data: "File size exceeds limit"
                invalid_type:
                  summary: 文件类型不支持
                  value:
                    code: 90004
                    message: "File upload failed" 
                    data: "Unsupported file type"
        '403':
          description: 无权限操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/{username}/profile:
    patch:
      tags:
        - 用户管理
      summary: 更新用户资料
      description: |
        更新用户的个人资料信息。
        
        **权限要求：** 只能更新自己的资料
        **可更新字段：**
        - nickname: 昵称（最大100字符）
        - bio: 个人简介（最大1023字符）
        - profileSlug: 个人页面地址（最大100字符）
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            example: "johndoe"
          description: 用户名（必须是当前登录用户）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新成功，返回更新后的用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          description: 参数验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/draft:
    get:
      tags:
        - 帖子管理
      summary: 获取当前用户帖子草稿
      description: |
        获取当前登录用户最新保存的帖子草稿。
        
        **权限要求：** 需要登录
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: 获取草稿成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/draft/{draftId}:
    put:
      tags:
        - 帖子管理
      summary: 编辑帖子草稿
      description: |
        更新指定草稿的标题、正文或分类信息。
        
        **权限要求：** 需要登录且必须是草稿作者
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: integer
          description: 草稿ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftContentEditorRequest'
      responses:
        '200':
          description: 草稿更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限编辑该草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 草稿不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/draft/{draftId}/publish:
    post:
      tags:
        - 帖子管理
      summary: 发布帖子草稿
      description: |
        将指定草稿发布为公开帖子。
        
        **权限要求：** 需要登录且必须是草稿作者
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: integer
          description: 草稿ID
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: 草稿状态不允许发布或内容存在敏感风险
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权限发布该草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 草稿不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts:
    get:
      tags:
        - 帖子管理
      summary: 分页查询公开帖子
      description: |
        获取已发布帖子列表，支持按分类筛选与分页。
        
        **默认排序：** 热度优先
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: "学习心得"
          description: 按分类过滤帖子
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 页码，从0开始
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
          description: 每页数量
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: 排序字段，格式示例：`createdAt,desc`
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - 帖子管理
      summary: 直接发布帖子
      description: |
        直接发布一个仅包含文字内容的帖子，跳过草稿箱流程。

        **权限要求：** 需要登录
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: 请求参数错误或内容存在敏感风险
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_failed:
                  summary: 参数校验失败
                  value:
                    code: 10001
                    message: "Invalid parameters"
                    data:
                      title: "标题不能为空"
                sensitive_content:
                  summary: 内容包含敏感词
                  value:
                    code: 10001
                    message: "Invalid parameters"
                    data:
                      content: "Content contains prohibited expressions."
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/hot:
    get:
      tags:
        - 帖子管理
      summary: 获取热门帖子
      description: |
        获取系统推荐的热门帖子列表，支持分页。
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
