tags:
  - name: 用户认证
    description: |
      用户认证相关接口，包括注册、登录、密码重置等功能
      
      **三种登录方式：**
      1. 用户名密码登录：POST /auth/login - 传统认证方式
      2. 邮箱验证码登录：POST /auth/login-with-code - 发送验证码 → 验证码登录
      3. 微信小程序登录：POST /auth/login-with-wechat - 获取微信code → 服务端验证
      
      **注册流程说明：**
      - 邮箱注册：发送验证码 → 验证码确认 → 完成注册
      - 微信注册：获取微信code → 服务端验证 → 完成注册
  - name: 用户管理
    description: |
      用户信息管理相关接口，包括查看用户信息、更新资料、头像上传等
      
      **权限说明：**
      - 查看信息：需要登录即可查看任何用户的公开信息
      - 修改资料：只能修改自己的资料
      - 上传头像：只能为自己上传头像
  - name: 帖子管理
    description: |
      帖子内容管理接口，包括草稿编辑、发布、删除以及列表查询等功能。
      
      **功能亮点：**
      - 支持草稿箱与发布状态切换
      - 提供按分类、关键字搜索的分页查询
      - 统一权限校验，确保只有作者可修改帖子
  - name: 帖子互动
    description: |
      帖子点赞、收藏与批量操作相关接口，帮助实现互动数据统计。
      
      **包含能力：**
      - 点赞/取消点赞、收藏/取消收藏
      - 查看自己的点赞、收藏列表与统计
      - 批量操作提高高频交互效率
  - name: 帖子媒体
    description: |
      帖子媒体资源管理接口，用于上传、删除与访问校验。
      
      **注意事项：**
      - 上传前需获取预签名URL
      - 仅帖子作者可上传或删除媒体
      - 支持校验媒体访问权限
  - name: 评论管理
    description: |
      评论及回复的增删改查、草稿、互动统计接口。
      
      **功能概览：**
      - 创建、编辑、删除评论
      - 分页获取评论及回复
      - 草稿保存与发布、点赞状态查询
  - name: 评论媒体
    description: |
      评论媒体上传与管理接口，流程与帖子媒体一致。
      
      **说明：**
      - 仅评论作者可上传/删除媒体
      - 支持多媒体内容，遵守大小及类型限制

# ==================== 错误码说明 ====================
# 通用错误码 (1xxxx)
# 10000: 成功
# 10001: 参数无效
# 10002: 未登录或token过期  
# 10003: 权限不足
# 10004: 请求过于频繁
#
# 用户模块错误码 (2xxxx)  
# 20001: 用户不存在
# 20002: 密码错误
# 20003: 用户已存在
# 20004: 不能关注自己
#
# 系统错误码 (9xxxx)
# 90001: 内部服务器错误
# 90002: 服务不可用
# 90003: 数据库操作失败
# 90004: 文件上传失败