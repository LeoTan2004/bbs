name: CI - Test then Docker Build & Push

on:
  push:
    branches:
      - develop
      - main


jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show computed image info (debug)
        run: |
          echo "REGISTRY=${{ env.REGISTRY }}"
          echo "NAMESPACE=${{ env.NAMESPACE }}"
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "COMPUTED_IMAGE_TAG=${IMAGE_TAG}"
          echo "GITHUB_REF=${GITHUB_REF}"
          docker --version || true
          docker buildx version || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile

      - name: Notify
        if: success()
        run: |
          echo "Docker image pushed: ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME} (sha-${GITHUB_SHA})"
