name: CI - Test then Docker Build & Push

on:
  push:
    branches:
      - develop
      - main


jobs:
  run-tests:
    name: Run tests (reusable)
    uses: ./.github/workflows/test.yml
    # `test.yml` now supports `workflow_call` and exposes outputs.
    # If `test.yml` requires inputs, pass them here under `with:`.

  build-and-push:
    name: Build and push Docker image
    needs: run-tests
    runs-on: ubuntu-latest
    if: ${{ needs.run-tests.outputs.test-status != 'FAILED' }}
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile

      - name: Notify
        if: success()
        run: |
          echo "Docker image pushed: ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME} (sha-${GITHUB_SHA})"
