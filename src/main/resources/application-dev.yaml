spring:
  jpa:
    open-in-view: off

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bbs_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true