spring:
  profiles:
    include:
      - dev
  application:
    name: BBS
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:123456789@qq.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      smtp:
        auth: true
        starttls:
          enable: true
    port: 465
    ssl:
      enabled: true
server:
  port: 8080
management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

bbs:
  oss:
    secret-id: ${OSS_SECRET_ID:secret-id}
    secret-key: ${OSS_SECRET_KEY:secret-key}
    region: ${OSS_REGION:ap-guangzhou}
    avatar:
      bucket: ${OSS_AVATAR_BUCKET:avatar-bucket}
      allow-types:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/bmp"
        - "image/webp"
      max-size: 5MB
      prefix: "/avatars"
      expired-after: 30s
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expired-time: 2h
  wechat:
    app:
      app-id: ${WECHAT_APP_APP_ID}
      app-secret: ${WECHAT_APP_APP_SECRET}
