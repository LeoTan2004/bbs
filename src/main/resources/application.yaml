spring:
  profiles:
    include:
      - dev
  application:
    name: BBS
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:123456789@qq.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      smtp:
        auth: true
        starttls:
          enable: true
    port: 465
    ssl:
      enabled: true
server:
  port: 8080

management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

bbs:
  oss:
    # Common OSS configuration
    secret-id: ${OSS_SECRET_ID:secret-id}
    secret-key: ${OSS_SECRET_KEY:secret-key}
    region: ${OSS_REGION:ap-guangzhou}
    # User avatar configuration
    avatar:
      bucket: ${OSS_AVATAR_BUCKET:avatar-bucket}
      allow-types:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/bmp"
        - "image/webp"
      max-size: 5MB
      prefix: "/avatars"
      expired-after: 30s
    # Post media file configuration
    post-media:
      bucket: ${OSS_MEDIA_BUCKET:media-bucket}
      allow-types:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "image/svg+xml"
        - "video/mp4"
        - "video/mpeg"
        - "video/quicktime"
        - "video/webm"
        - "audio/mpeg"
        - "audio/wav"
        - "audio/ogg"
        - "application/pdf"
        - "text/plain"
        - "application/msword"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      max-size: 50MB
      max-files: ${OSS_MAX_FILES_PER_POST:10}
      prefix: "/posts"
      expired-after: 60s
    # Comment media file configuration  
    comment-media:
      bucket: ${OSS_MEDIA_BUCKET:media-bucket}
      allow-types:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "video/mp4"
        - "video/webm"
        - "audio/mpeg"
        - "audio/wav"
        - "text/plain"
        - "application/pdf"
      max-size: 20MB
      max-files: ${OSS_MAX_FILES_PER_COMMENT:5}
      prefix: "/comments"
      expired-after: 60s
  post:
    media-limits:
      max-post-media: ${OSS_MAX_FILES_PER_POST:10}
      max-comment-media: ${OSS_MAX_FILES_PER_COMMENT:5}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expired-time: 2h
  wechat:
    app:
      app-id: ${WECHAT_APP_APP_ID}
      app-secret: ${WECHAT_APP_APP_SECRET}
  validator:
    sensitive-words:
      include:
        - ni
